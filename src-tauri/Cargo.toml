[package]
name = "mori-schedule-manager"
version = "0.5.0"
description = "Mori cross-platform schedule and task manager"
authors = ["Mori"]
edition = "2021"

[lib]
name = "mori_schedule_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
