name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundle: nsis
            artifact: Mori-Windows-x64
            path: project/src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: Mori-macOS-arm64
            path: project/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: Mori-macOS-x64
            path: project/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract project on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path mori-schedule-manager-source-v0.5.0.zip -DestinationPath project
      - name: Extract project on macOS
        if: runner.os == 'macOS'
        run: unzip mori-schedule-manager-source-v0.5.0.zip -d project
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        working-directory: project
        run: npm ci
      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: project
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Build macOS
        if: runner.os == 'macOS'
        working-directory: project
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
