name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            bundle: nsis
            artifact: Mori-Windows-x64
            path: src-tauri/target/release/bundle/nsis/*-setup.exe
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: Mori-macOS-arm64
            path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: Mori-macOS-x64
            path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
